name: Notify bebot-helm

# Opens a PR against zznathans/bebot-helm bumping its vendored copy of this
# repo to whatever commit was just released, so a human still reviews/merges
# before bebot-helm's own CI -> release -> Docker build -> chart publish
# pipeline fires. RELEASE_PAT is a fine-grained personal access token
# scoped to zznathans/bebot-helm (and this repo, for release.yml) with
# Contents: write, Pull requests: write.
on:
  release:
    types: [published]

jobs:
  bump-bebot-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: zznathans/bebot-helm
          token: ${{ secrets.RELEASE_PAT }}
          submodules: recursive

      - name: Point the vendored submodule at this release
        working-directory: charts/bebot/vendor/BeBot
        run: |
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Open a PR against bebot-helm
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- charts/bebot/vendor/BeBot; then
            echo "Submodule already up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="bump-bebot-${RELEASE_TAG}"
          git checkout -b "$branch"
          git add charts/bebot/vendor/BeBot
          git commit -m "fix(bot): bump vendored BeBot submodule to ${RELEASE_TAG}"
          git push origin "$branch"

          gh pr create \
            --repo zznathans/bebot-helm \
            --base main \
            --head "$branch" \
            --title "fix(bot): bump vendored BeBot submodule to ${RELEASE_TAG}" \
            --body "Bumps \`charts/bebot/vendor/BeBot\` to [zznathans/BeBot ${RELEASE_TAG}](https://github.com/zznathans/BeBot/releases/tag/${RELEASE_TAG})."
