name: Docker (dev)

# On-demand (workflow_dispatch) or nightly (schedule) image build for
# testing unreleased code. Unlike docker.yml, this does NOT run on every
# push or release - only on request or once a night - and tags never
# collide with a real semver release tag.
#
# Nightly-tag consumers (e.g. a "bebot-nightly" deployment elsewhere) are
# expected to poll ghcr.io for the newest dev-* tag themselves rather than
# this workflow reaching out and pushing to them - keeps this repo's public
# workflow/logs from needing to know anything about who consumes the tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build"
        required: false
        default: ""
  schedule:
    # ~08:00 UTC daily. Adjust if you want it at a different time.
    - cron: "0 8 * * *"

jobs:
  build-bebot-dev-image:
    name: Build and Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute dev tag
        id: tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Single-platform only - this is a throwaway dev image, not a
          # release artifact, so skip the amd64+arm64 matrix to keep it fast.
          platforms: linux/amd64
          tags: ghcr.io/zznathans/bebot:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
