name: Docker (dev)

# On-demand (workflow_dispatch) or nightly (schedule) image build for
# testing unreleased code. Unlike docker.yml, this does NOT run on every
# push or release - only on request or once a night - and tags never
# collide with a real semver release tag.
#
# Nightly runs (schedule only, not manual dispatches - an ad-hoc dev build
# of an arbitrary branch shouldn't silently take over the shared nightly
# instance) additionally bump argocd/charts' bebot-nightly app to the
# freshly-built tag and push directly to that repo's main - no PR gate,
# unlike the real bebot app's image-bump flow: the whole point of "nightly"
# is unattended updates, and argocd/charts has no branch-protection ruleset
# blocking direct pushes the way BeBot/bebot-helm do.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build"
        required: false
        default: ""
  schedule:
    # ~08:00 UTC daily. Adjust if you want it at a different time.
    - cron: "0 8 * * *"

jobs:
  build-bebot-dev-image:
    name: Build and Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute dev tag
        id: tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Single-platform only - this is a throwaway dev image, not a
          # release artifact, so skip the amd64+arm64 matrix to keep it fast.
          platforms: linux/amd64
          tags: ghcr.io/zznathans/bebot:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-nightly:
    name: Update bebot-nightly's image tag
    needs: build-bebot-dev-image
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: zznathans/charts
          token: ${{ secrets.RELEASE_PAT }}

      - name: Bump bebot-nightly's imageTag and push
        env:
          TAG: ${{ needs.build-bebot-dev-image.outputs.tag }}
        run: |
          sed -i "s|^    imageTag: .*|    imageTag: \"${TAG}\"|" bebot-nightly/values.yaml

          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bebot-nightly/values.yaml
          git commit -m "chore(bebot-nightly): bump to ${TAG}"
          git push origin main
